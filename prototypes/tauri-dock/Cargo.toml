[package]
name = "pma-proto-tauri-dock"
version = "0.1.0"
edition = "2021"
publish = false
description = "画面を Rust にする判断のための試作（Tauri + dockview）。アプリには組み込まない。"

[workspace]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSDictionary", "NSError", "NSString", "NSRange"] }
objc2-app-kit = { version = "0.3", features = ["NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics", "NSEvent", "NSApplication", "NSResponder", "NSWindow", "NSScreen", "NSView"] }
objc2-core-graphics = { version = "0.3", features = ["CGEvent", "CGEventTypes", "CGRemoteOperation", "libc"] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKSnapshotConfiguration", "block2", "objc2-app-kit"] }
block2 = "0.6"
