[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "paintmaskanimator"
version = "0.6.4"
description = "Paint / mask animation tool (PySide6)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Editors",
]
dependencies = [
    "PySide6>=6.5,<7",
    "PySide6-QtAds>=5.0,<5.1",
    "numpy>=1.24,<3",
]

[project.optional-dependencies]
full = ["Pillow>=9.4", "psd-tools>=1.9"]
dev = [
    "pytest>=8",
    "pytest-cov>=4",
    "pytest-qt>=4.4",
    "pyinstaller>=6",
    "ruff>=0.6",
    "pyright>=1.1.390",
    "Pillow>=9.4",
]

[project.gui-scripts]
paintmaskanimator = "paintmaskanimator.__main__:main"

[tool.setuptools]
packages = ["paintmaskanimator"]

[tool.setuptools.package-data]
paintmaskanimator = ["assets/**/*", "translations/*.qm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: 実イベントでUIを操作するエンドツーエンドのシナリオテスト",
]

[tool.coverage.run]
source = ["paintmaskanimator"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 37.0

[tool.pyright]
include = ["paintmaskanimator", "scripts", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
# PySide6/Qt's stubs surface many dynamic-attribute and Optional-narrowing
# false positives across this legacy GUI code. Downgrade the high-volume,
# Qt-driven rules to warnings so the CI gate still fails on *new* real bugs
# (undefined names, bad calls in typed code) while we tighten incrementally.
reportAttributeAccessIssue = "warning"
reportArgumentType = "warning"
# reportOptionalMemberAccess is clean and back at error level; the rest are
# tightened the same way once their remaining sites are typed.
reportCallIssue = "warning"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Enforce pyflakes (F, catches undefined names / unused imports) and
# pycodestyle errors+warnings (E/W). Stylistic-only rule families (UP, RUF,
# SIM, …) are intentionally left out for now to keep the gate meaningful and
# the diff small; tighten incrementally.
select = ["E4", "E9", "F", "W", "B"]
# E7 statement-style rules are omitted on purpose: this code base deliberately
# uses compact `;`-separated one-liners.
# B905 (zip without `strict=`) needs a per-call-site decision about whether
# unequal lengths are a bug or intentional truncation; enabling it blindly
# would just add `strict=False` noise. Revisit call site by call site.
# Purely stylistic families stay out for now (as of this commit: SIM 10,
# UP 32, RET 1, C4 1 findings) so the gate keeps flagging real defects only.
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
# common.py now only holds the optional-dependency shims (PILImage/PSDImage
# fall back to None); it re-exports them, so its imports are "unused" locally.
"paintmaskanimator/common.py" = ["F401"]
