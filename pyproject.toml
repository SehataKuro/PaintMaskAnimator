[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "paintmaskanimator"
version = "0.6.1"
description = "Paint / mask animation tool (PySide6)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5,<7",
    "PySide6-QtAds>=5.0,<5.1",
    "numpy>=1.24,<2",
]

[project.optional-dependencies]
full = ["Pillow>=9.4", "psd-tools>=1.9"]
dev = ["pytest>=8", "pyinstaller>=6", "Pillow>=9.4"]

[project.gui-scripts]
paintmaskanimator = "paintmaskanimator.__main__:main"

[tool.setuptools]
packages = ["paintmaskanimator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["paintmaskanimator"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
# PySide6/Qt's stubs surface many dynamic-attribute and Optional-narrowing
# false positives across this legacy GUI code. Downgrade the high-volume,
# Qt-driven rules to warnings so the CI gate still fails on *new* real bugs
# (undefined names, bad calls in typed code) while we tighten incrementally.
reportAttributeAccessIssue = "warning"
reportArgumentType = "warning"
reportOptionalMemberAccess = "warning"
reportCallIssue = "warning"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# The package uses `from .common import *` on purpose (shared Qt/stdlib names);
# don't flag star imports or the resulting "may be undefined" noise.
ignore = ["F403", "F405"]
