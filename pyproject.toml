[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "paintmaskanimator"
version = "0.6.3"
description = "Paint / mask animation tool (PySide6)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5,<7",
    "PySide6-QtAds>=5.0,<5.1",
    "numpy>=1.24,<2",
]

[project.optional-dependencies]
full = ["Pillow>=9.4", "psd-tools>=1.9"]
dev = [
    "pytest>=8",
    "pytest-cov>=4",
    "pyinstaller>=6",
    "ruff>=0.6",
    "pyright>=1.1.390",
    "Pillow>=9.4",
]

[project.gui-scripts]
paintmaskanimator = "paintmaskanimator.__main__:main"

[tool.setuptools]
packages = ["paintmaskanimator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["paintmaskanimator"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 35.0

[tool.pyright]
include = ["paintmaskanimator", "scripts", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
# PySide6/Qt's stubs surface many dynamic-attribute and Optional-narrowing
# false positives across this legacy GUI code. Downgrade the high-volume,
# Qt-driven rules to warnings so the CI gate still fails on *new* real bugs
# (undefined names, bad calls in typed code) while we tighten incrementally.
reportAttributeAccessIssue = "warning"
reportArgumentType = "warning"
reportOptionalMemberAccess = "warning"
reportCallIssue = "warning"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Enforce pyflakes (F, catches undefined names / unused imports) and
# pycodestyle errors+warnings (E/W). Stylistic-only rule families (UP, RUF,
# SIM, …) are intentionally left out for now to keep the gate meaningful and
# the diff small; tighten incrementally.
select = ["E4", "E9", "F", "W"]
# The package uses `from .common import *` on purpose (shared Qt/stdlib names);
# don't flag star imports or the resulting "may be undefined" noise.
# E7 statement-style rules are omitted on purpose: this code base deliberately
# uses compact `;`-separated one-liners.
ignore = ["F403", "F405"]

[tool.ruff.lint.per-file-ignores]
# common.py is a deliberate re-export hub: every module does
# `from .common import *`, so its imports are "unused" only locally.
"paintmaskanimator/common.py" = ["F401"]
