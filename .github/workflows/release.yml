name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.5.1)"
        required: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install Pillow psd-tools

      - name: Validate release version
        run: python scripts/check_version.py "${{ steps.ver.outputs.version }}"

      - name: Lint and type check
        run: |
          ruff check paintmaskanimator tests scripts
          pyright

      - name: Check translation catalogues are current
        run: python scripts/update_translations.py --check

      - name: Compile translation catalogues
        run: python scripts/update_translations.py

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/run_tests.py -q

      - name: Build exe (PyInstaller)
        run: pyinstaller packaging/PaintMaskAnimator.spec --noconfirm

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer (Inno Setup)
        shell: cmd
        run: |
          iscc /DAppVersion=${{ steps.ver.outputs.version }} packaging\installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PaintMaskAnimator-Setup-${{ steps.ver.outputs.version }}
          path: dist_installer/*.exe
          # Only a hand-off to publish-release, which attaches the file to the
          # GitHub Release. Kept longer, every release's installers pile up
          # against the Actions storage quota and a later upload fails.
          retention-days: 1

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install Pillow psd-tools

      - name: Validate release version
        run: python scripts/check_version.py "${{ steps.ver.outputs.version }}"

      - name: Lint and type check
        run: |
          ruff check paintmaskanimator tests scripts
          pyright

      - name: Check translation catalogues are current
        run: python scripts/update_translations.py --check

      - name: Compile translation catalogues
        run: python scripts/update_translations.py

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/run_tests.py -q

      - name: Build app (PyInstaller)
        run: pyinstaller packaging/PaintMaskAnimator.spec --noconfirm

      - name: Build DMG
        shell: bash
        run: |
          pip install dmgbuild
          # Window layout, background and the "Open Anyway" note (the app is
          # not notarized) live in packaging/macos/dmg_settings.py.
          dmgbuild \
            -s packaging/macos/dmg_settings.py \
            -D app=dist/PaintMaskAnimator.app \
            "PaintMaskAnimator" \
            "PaintMaskAnimator-${{ steps.ver.outputs.version }}-macOS.dmg"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: PaintMaskAnimator-${{ steps.ver.outputs.version }}-macOS
          path: PaintMaskAnimator-${{ steps.ver.outputs.version }}-macOS.dmg
          # Only a hand-off to publish-release, which attaches the file to the
          # GitHub Release. Kept longer, every release's installers pile up
          # against the Actions storage quota and a later upload fails.
          retention-days: 1

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Build release notes from changelog
        run: |
          python scripts/extract_release_notes.py \
            "${GITHUB_REF_NAME#v}" \
            --output release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          body_path: release-notes.md
