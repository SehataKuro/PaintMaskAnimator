name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.5.1)"
        required: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install Pillow psd-tools

      - name: Validate release version
        run: python scripts/check_version.py "${{ steps.ver.outputs.version }}"

      - name: Lint and type check
        run: |
          ruff check paintmaskanimator tests scripts
          pyright

      - name: Check translation catalogues are current
        run: python scripts/update_translations.py --check

      - name: Compile translation catalogues
        run: python scripts/update_translations.py

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/run_tests.py -q

      - name: Build exe (PyInstaller)
        run: pyinstaller packaging/PaintMaskAnimator.spec --noconfirm

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer (Inno Setup)
        shell: cmd
        run: |
          iscc /DAppVersion=${{ steps.ver.outputs.version }} packaging\installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PaintMaskAnimator-Setup-${{ steps.ver.outputs.version }}
          path: dist_installer/*.exe
          # Only a hand-off to publish-release, which puts the file on the GitHub
          # Release and R2. Kept longer, every release's installers pile up
          # against the Actions storage quota and a later upload fails.
          retention-days: 1

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install Pillow psd-tools

      - name: Validate release version
        run: python scripts/check_version.py "${{ steps.ver.outputs.version }}"

      - name: Lint and type check
        run: |
          ruff check paintmaskanimator tests scripts
          pyright

      - name: Check translation catalogues are current
        run: python scripts/update_translations.py --check

      - name: Compile translation catalogues
        run: python scripts/update_translations.py

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/run_tests.py -q

      - name: Build app (PyInstaller)
        run: pyinstaller packaging/PaintMaskAnimator.spec --noconfirm

      - name: Build DMG
        shell: bash
        run: |
          mkdir -p dmg-root
          cp -R dist/PaintMaskAnimator.app dmg-root/
          ln -s /Applications dmg-root/Applications
          # Not notarized: ship the "Open Anyway" steps next to the app.
          cp "packaging/macos/開けないときは.txt" dmg-root/
          hdiutil create \
            -volname "PaintMaskAnimator" \
            -srcfolder dmg-root \
            -ov -format UDZO \
            "PaintMaskAnimator-${{ steps.ver.outputs.version }}-macOS.dmg"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: PaintMaskAnimator-${{ steps.ver.outputs.version }}-macOS
          path: PaintMaskAnimator-${{ steps.ver.outputs.version }}-macOS.dmg
          # Only a hand-off to publish-release, which puts the file on the GitHub
          # Release and R2. Kept longer, every release's installers pile up
          # against the Actions storage quota and a later upload fails.
          retention-days: 1

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Build release notes from changelog
        run: |
          python scripts/extract_release_notes.py \
            "${GITHUB_REF_NAME#v}" \
            --output release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          body_path: release-notes.md

  publish-to-site:
    # Installers exceed Cloudflare Pages' 25 MiB static-asset limit, so they are
    # uploaded to an R2 bucket (served via a Pages Function) instead of being
    # committed to the site repo. Only the small JSON indexes are committed.
    # Runs after the GitHub Release exists so the indexes reflect it.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [publish-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download built installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Upload installers to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'paintmaskanimator-downloads' }}
        run: |
          find release-assets -type f \
            \( -iname '*.exe' -o -iname '*.dmg' \) -print0 |
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            echo "Uploading $name to R2 bucket $R2_BUCKET"
            npx --yes wrangler@4 r2 object put "$R2_BUCKET/$name" \
              --file "$file" --remote
          done

      - name: Build download indexes from releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/releases" --paginate > releases.json
          python scripts/generate_download_indexes.py \
            --input releases.json \
            --base-url https://jokomanato.com/paintmaskanimator \
            --download-subdir downloads \
            --versions-output versions.json \
            --updates-output updates.json

      - name: Check out website repository
        uses: actions/checkout@v4
        with:
          repository: SehataKuro/jokomanato.com
          ref: main
          token: ${{ secrets.JOKOMANATO_DEPLOY_TOKEN }}
          path: website

      - name: Publish download indexes
        run: |
          dest="website/public/paintmaskanimator"
          mkdir -p "$dest"
          cp updates.json "$dest/updates.json"
          cp versions.json "$dest/versions.json"
          cd website
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/paintmaskanimator/updates.json public/paintmaskanimator/versions.json
          if git diff --cached --quiet; then
            echo "Download indexes already up to date."
            exit 0
          fi
          git commit -m "chore: refresh PaintMaskAnimator download indexes (${GITHUB_REF_NAME})"
          git push origin HEAD:main
