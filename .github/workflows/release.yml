name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.5.1)"
        required: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install Pillow psd-tools

      - name: Validate release version
        run: python scripts/check_version.py "${{ steps.ver.outputs.version }}"

      - name: Lint and type check
        run: |
          ruff check paintmaskanimator tests scripts
          pyright

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/run_tests.py -q

      - name: Build exe (PyInstaller)
        run: pyinstaller packaging/PaintMaskAnimator.spec --noconfirm

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer (Inno Setup)
        shell: cmd
        run: |
          iscc /DAppVersion=${{ steps.ver.outputs.version }} packaging\installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PaintMaskAnimator-Setup-${{ steps.ver.outputs.version }}
          path: dist_installer/*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install Pillow psd-tools

      - name: Validate release version
        run: python scripts/check_version.py "${{ steps.ver.outputs.version }}"

      - name: Lint and type check
        run: |
          ruff check paintmaskanimator tests scripts
          pyright

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/run_tests.py -q

      - name: Build app (PyInstaller)
        run: pyinstaller packaging/PaintMaskAnimator.spec --noconfirm

      - name: Build DMG
        shell: bash
        run: |
          mkdir -p dmg-root
          cp -R dist/PaintMaskAnimator.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create \
            -volname "PaintMaskAnimator" \
            -srcfolder dmg-root \
            -ov -format UDZO \
            "PaintMaskAnimator-${{ steps.ver.outputs.version }}-macOS.dmg"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: PaintMaskAnimator-${{ steps.ver.outputs.version }}-macOS
          path: PaintMaskAnimator-${{ steps.ver.outputs.version }}-macOS.dmg

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true

  publish-to-site:
    # Host the installers on the public site path and refresh updates.json so
    # the in-app updater works without any token/credential.
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download built installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate update manifest
        run: |
          python scripts/generate_update_manifest.py \
            --version "${{ steps.ver.outputs.version }}" \
            --assets-dir release-assets \
            --base-url https://jokomanato.com/paintmaskanimator \
            --download-subdir downloads \
            --output updates.json
          cat updates.json

      - name: Check out website repository
        uses: actions/checkout@v4
        with:
          repository: SehataKuro/jokomanato.com
          ref: main
          token: ${{ secrets.JOKOMANATO_DEPLOY_TOKEN }}
          path: website

      - name: Publish installers and manifest
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          dest="website/public/paintmaskanimator"
          mkdir -p "$dest/downloads"
          # Copy the installer binaries (ignore any non-installer artifacts).
          # Past releases already in downloads/ are preserved (never deleted),
          # so the directory accumulates the full download history.
          find release-assets -type f \
            \( -iname '*.exe' -o -iname '*.dmg' \) \
            -exec cp {} "$dest/downloads/" \;
          cp updates.json "$dest/updates.json"
          # Rebuild the full version history from everything now hosted.
          python scripts/generate_versions_index.py \
            --downloads-dir "$dest/downloads" \
            --base-url https://jokomanato.com/paintmaskanimator \
            --download-subdir downloads \
            --output "$dest/versions.json"
          cd website
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/paintmaskanimator/downloads public/paintmaskanimator/updates.json public/paintmaskanimator/versions.json
          if git diff --cached --quiet; then
            echo "No installer changes to publish."
            exit 0
          fi
          git commit -m "chore: publish PaintMaskAnimator installers v${VERSION}"
          git push origin HEAD:main
