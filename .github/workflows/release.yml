name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.5.1)"
        required: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install Pillow psd-tools

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q --junit-xml=pytest-results.xml || true

      - name: Check test results
        run: python scripts/check_pytest_results.py pytest-results.xml

      - name: Build exe (PyInstaller)
        run: pyinstaller packaging/PaintMaskAnimator.spec --noconfirm

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer (Inno Setup)
        shell: cmd
        run: |
          iscc /DAppVersion=${{ steps.ver.outputs.version }} packaging\installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PaintMaskAnimator-Setup-${{ steps.ver.outputs.version }}
          path: dist_installer/*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install Pillow psd-tools

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q --junit-xml=pytest-results.xml || true

      - name: Check test results
        run: python scripts/check_pytest_results.py pytest-results.xml

      - name: Build app (PyInstaller)
        run: pyinstaller packaging/PaintMaskAnimator.spec --noconfirm

      - name: Build DMG
        shell: bash
        run: |
          mkdir -p dmg-root
          cp -R dist/PaintMaskAnimator.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create \
            -volname "PaintMaskAnimator" \
            -srcfolder dmg-root \
            -ov -format UDZO \
            "PaintMaskAnimator-${{ steps.ver.outputs.version }}-macOS.dmg"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: PaintMaskAnimator-${{ steps.ver.outputs.version }}-macOS
          path: PaintMaskAnimator-${{ steps.ver.outputs.version }}-macOS.dmg

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
