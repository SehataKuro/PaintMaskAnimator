name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Portability gate: the declared floor (3.10) and ceiling (3.12) of
  # requires-python, plus Windows — the primary distribution target, where
  # path handling and APPDATA-backed config would otherwise go unexercised.
  # Lint/typecheck/coverage/site generation stay in the `test` job below so
  # this one only answers "does it run there?".
  portability:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.11"
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libglib2.0-0 libfontconfig1 libfreetype6

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile translation catalogues
        run: python scripts/update_translations.py

      - name: Run tests
        run: python scripts/run_tests.py -q

  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # System libraries PySide6 needs even in offscreen mode.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libglib2.0-0 libfontconfig1 libfreetype6

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check paintmaskanimator tests scripts

      # The README release badges are static (private repo -> shields.io cannot
      # read the version), so check they still match pyproject.
      - name: Check README version badges
        run: python scripts/check_version.py

      - name: Type check (pyright)
        run: pyright

      # A newly wrapped tr() string must land with its catalogue entry, or the
      # translation simply never appears -- silently, since an unresolved lookup
      # returns the Japanese source string.
      - name: Check translation catalogues are current
        run: python scripts/update_translations.py --check

      - name: Compile translation catalogues
        run: python scripts/update_translations.py

      - name: Run tests
        run: >
          python scripts/run_tests.py -q
          --cov=paintmaskanimator --cov-report=term-missing --cov-report=xml
          --cov-report=json:progress-site/.coverage-map.json
          --cov-report=html:coverage-html

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: progress-site/package-lock.json

      - name: Generate feature verification map
        working-directory: progress-site
        env:
          SITE_BASE_PATH: /paintmaskanimator
        run: |
          npm ci
          npm run data
          npm test
          npm run export-site

      # export-site rebuilds dist/site from scratch, so the coverage report is
      # copied in afterwards. It is then served at /paintmaskanimator/coverage.
      # (The download page lives under downloads/, which the deploy step keeps
      # separate from the rsynced feature map — see publish-feature-map.)
      - name: Add coverage report to site
        run: |
          mkdir -p progress-site/dist/site/coverage
          cp -R coverage-html/. progress-site/dist/site/coverage/

      - name: Upload feature map artifact
        uses: actions/upload-artifact@v4
        with:
          name: feature-map-${{ github.sha }}
          path: progress-site/dist/site
          include-hidden-files: true
          # Only a hand-off to publish-feature-map; see release.yml.
          retention-days: 1

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  publish-feature-map:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, portability]
    runs-on: ubuntu-latest
    concurrency:
      group: publish-feature-map
      cancel-in-progress: true
    steps:
      - name: Download generated site
        uses: actions/download-artifact@v4
        with:
          name: feature-map-${{ github.sha }}
          path: generated-site

      - name: Check out this repository (for deploy assets)
        uses: actions/checkout@v4
        with:
          path: source

      - name: Check out website repository
        uses: actions/checkout@v4
        with:
          repository: SehataKuro/jokomanato.com
          ref: main
          token: ${{ secrets.JOKOMANATO_DEPLOY_TOKEN }}
          path: website

      - name: Update website content
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p website/public/paintmaskanimator
          # --delete keeps the site in sync with the generated output, but the
          # download indexes are published by the Release workflow (not here),
          # so they must be preserved.
          rsync -a --delete \
            --exclude 'downloads/' \
            --exclude 'updates.json' \
            --exclude 'versions.json' \
            generated-site/ website/public/paintmaskanimator/
          # The static download page lives under the excluded downloads/ dir
          # (kept separate so the JSON indexes there are never rsync-deleted),
          # so copy it in explicitly. Installers live in R2 and are streamed by
          # the downloads Function; the indexes come from the Release workflow.
          mkdir -p website/public/paintmaskanimator/downloads
          cp source/deploy/jokomanato/downloads/index.html \
            website/public/paintmaskanimator/downloads/index.html
          # Cloudflare Pages Functions: Basic-auth over the whole path, plus the
          # R2-backed installer download route.
          mkdir -p website/functions/paintmaskanimator/downloads
          cp source/deploy/jokomanato/functions/paintmaskanimator/_middleware.js \
            website/functions/paintmaskanimator/_middleware.js
          cp "source/deploy/jokomanato/functions/paintmaskanimator/downloads/[[path]].js" \
            "website/functions/paintmaskanimator/downloads/[[path]].js"
          cd website
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/paintmaskanimator functions/paintmaskanimator
          if git diff --cached --quiet; then
            echo "Feature map is already up to date."
            exit 0
          fi
          git commit -m "chore: update PaintMaskAnimator feature map (${SOURCE_SHA::7})"
          git push origin HEAD:main
