name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # System libraries PySide6 needs even in offscreen mode.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libglib2.0-0 libfontconfig1 libfreetype6

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check paintmaskanimator tests

      - name: Type check (pyright)
        run: pyright

      # The full GUI suite passes, but running many PySide6 CDockManager windows
      # in one interpreter can segfault during static teardown *after* the run
      # finishes (all tests still pass). That would flip the process exit code,
      # so gate CI on the JUnit report instead — which still catches real
      # failures and any crash that happens before results are written.
      - name: Run tests
        run: >
          pytest -q --junit-xml=pytest-results.xml
          --cov=paintmaskanimator --cov-report=term-missing --cov-report=xml
          || true
      - name: Check test results
        run: python scripts/check_pytest_results.py pytest-results.xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
