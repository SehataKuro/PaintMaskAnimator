name: CI

on:
  # Only main on push: a branch with an open PR would otherwise run the whole
  # workflow twice for the same commit (once as `push`, once as `pull_request`),
  # and the two runs are different refs, so `concurrency` cannot collapse them.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded commits on the same branch/PR stop immediately instead of holding
# a runner. main is excluded so every landed commit keeps a complete run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The native extension's own test suite. Previously nothing in CI ran it, so
  # Rust-side logic bugs reached main as long as the crate compiled.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # cargo test/clippy build pyo3 *without* the extension-module feature
      # (maturin only sets it for the wheel), so the crate links against
      # libpython and needs a real interpreter present.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          shared-key: native-check

      - name: Check formatting (rustfmt)
        working-directory: native
        run: cargo fmt --all --check

      - name: Lint (clippy)
        working-directory: native
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        working-directory: native
        run: cargo test --all-features

  # The Explorer thumbnail handler is Windows-only (windows-rs) and is built
  # only by release.yml, so without this job a break in it surfaces for the
  # first time while cutting a release.
  rust-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packaging/windows/pman_thumbnail
          shared-key: thumbnail

      - name: Check formatting (rustfmt)
        working-directory: packaging/windows/pman_thumbnail
        run: cargo fmt --all --check

      - name: Lint (clippy)
        working-directory: packaging/windows/pman_thumbnail
        run: cargo clippy --all-targets -- -D warnings

  # Portability gate: the declared floor (3.10) and ceiling (3.12) of
  # requires-python, plus the two desktop platforms we ship installers for.
  # macOS is here because release.yml builds a .dmg; without it the first
  # macOS run of the code is the release build itself.
  # Lint/typecheck/coverage/site generation stay in the `test` job below so
  # this one only answers "does it run there?".
  portability:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.11"
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-build-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile translation catalogues
        run: python scripts/update_translations.py

      - name: Run tests
        run: python scripts/run_tests.py -q

  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-build-env

      - uses: ./.github/actions/static-checks

      # The README release badges are static (private repo -> shields.io cannot
      # read the version), so check they still match pyproject.
      - name: Check README version badges
        run: python scripts/check_version.py

      - name: Run tests
        run: >
          python scripts/run_tests.py -q
          --cov=paintmaskanimator --cov-report=term-missing --cov-report=xml
          --cov-report=json:progress-site/.coverage-map.json
          --cov-report=html:coverage-html

      # coverage.xml used to be uploaded as an artifact nothing ever read.
      # The number is worth seeing on the run itself instead.
      - name: Report coverage
        if: always()
        run: python scripts/coverage_summary.py coverage.xml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: progress-site/package-lock.json

      - name: Generate feature verification map
        working-directory: progress-site
        env:
          SITE_BASE_PATH: /paintmaskanimator
        run: |
          npm ci
          npm run data
          npm test
          npm run export-site

      # export-site rebuilds dist/site from scratch, so the coverage report is
      # copied in afterwards. It is then served at /paintmaskanimator/coverage.
      - name: Add coverage report to site
        run: |
          mkdir -p progress-site/dist/site/coverage
          cp -R coverage-html/. progress-site/dist/site/coverage/

      - name: Upload feature map artifact
        uses: actions/upload-artifact@v4
        with:
          name: feature-map-${{ github.sha }}
          path: progress-site/dist/site
          include-hidden-files: true
          # Only a hand-off to publish-feature-map; see release.yml.
          retention-days: 1

  publish-feature-map:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, portability, rust, rust-windows]
    runs-on: ubuntu-latest
    concurrency:
      group: publish-feature-map
      cancel-in-progress: true
    steps:
      - name: Download generated site
        uses: actions/download-artifact@v4
        with:
          name: feature-map-${{ github.sha }}
          path: generated-site

      - name: Check out this repository (for deploy assets)
        uses: actions/checkout@v4
        with:
          path: source

      - name: Check out website repository
        uses: actions/checkout@v4
        with:
          repository: SehataKuro/jokomanato.com
          ref: main
          token: ${{ secrets.JOKOMANATO_DEPLOY_TOKEN }}
          path: website

      - name: Update website content
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p website/public/paintmaskanimator
          # --delete keeps the site in sync with the generated output. It also
          # removes what the site used to distribute (the download page under
          # downloads/ and the updates.json / versions.json indexes): releases
          # are now distributed from GitHub Releases only.
          rsync -a --delete \
            generated-site/ website/public/paintmaskanimator/
          # Cloudflare Pages Function: Basic-auth over the whole path. The
          # R2-backed installer route is gone along with the downloads.
          rm -rf website/functions/paintmaskanimator/downloads
          mkdir -p website/functions/paintmaskanimator
          cp source/deploy/jokomanato/functions/paintmaskanimator/_middleware.js \
            website/functions/paintmaskanimator/_middleware.js
          cd website
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/paintmaskanimator functions/paintmaskanimator
          if git diff --cached --quiet; then
            echo "Feature map is already up to date."
            exit 0
          fi
          git commit -m "chore: update PaintMaskAnimator feature map (${SOURCE_SHA::7})"
          git push origin HEAD:main
