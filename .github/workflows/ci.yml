name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # System libraries PySide6 needs even in offscreen mode.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libglib2.0-0 libfontconfig1 libfreetype6

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check paintmaskanimator tests scripts

      - name: Type check (pyright)
        run: pyright

      - name: Run tests
        run: >
          python scripts/run_tests.py -q
          --cov=paintmaskanimator --cov-report=term-missing --cov-report=xml
          --cov-report=json:progress-site/.coverage-map.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: progress-site/package-lock.json

      - name: Generate feature verification map
        working-directory: progress-site
        env:
          SITE_BASE_PATH: /paintmaskanimator
        run: |
          npm ci
          npm run data
          npm test
          npm run export-site

      - name: Upload feature map artifact
        uses: actions/upload-artifact@v4
        with:
          name: feature-map-${{ github.sha }}
          path: progress-site/dist/site
          include-hidden-files: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  publish-feature-map:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: publish-feature-map
      cancel-in-progress: true
    steps:
      - name: Download generated site
        uses: actions/download-artifact@v4
        with:
          name: feature-map-${{ github.sha }}
          path: generated-site

      - name: Check out website repository
        uses: actions/checkout@v4
        with:
          repository: SehataKuro/jokomanato.com
          ref: main
          token: ${{ secrets.JOKOMANATO_DEPLOY_TOKEN }}
          path: website

      - name: Update website content
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p website/public/paintmaskanimator
          rsync -a --delete generated-site/ website/public/paintmaskanimator/
          cd website
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/paintmaskanimator
          if git diff --cached --quiet; then
            echo "Feature map is already up to date."
            exit 0
          fi
          git commit -m "chore: update PaintMaskAnimator feature map (${SOURCE_SHA::7})"
          git push origin HEAD:main
