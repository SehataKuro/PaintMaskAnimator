name: CI

on:
  # Only main on push: a branch with an open PR would otherwise run the whole
  # workflow twice for the same commit (once as `push`, once as `pull_request`),
  # and the two runs are different refs, so `concurrency` cannot collapse them.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded commits on the same branch/PR stop immediately instead of holding
# a runner. main is excluded so every landed commit keeps a complete run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The native extension's own test suite. Previously nothing in CI ran it, so
  # Rust-side logic bugs reached main as long as the crate compiled.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # cargo test/clippy build pyo3 *without* the extension-module feature
      # (maturin only sets it for the wheel), so the crate links against
      # libpython and needs a real interpreter present.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          shared-key: native-check

      - name: Check formatting (rustfmt)
        working-directory: native
        run: cargo fmt --all --check

      - name: Lint (clippy)
        working-directory: native
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        working-directory: native
        run: cargo test --all-features

  # The Explorer thumbnail handler is Windows-only (windows-rs) and is built
  # only by release.yml, so without this job a break in it surfaces for the
  # first time while cutting a release.
  rust-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packaging/windows/pman_thumbnail
          shared-key: thumbnail

      - name: Check formatting (rustfmt)
        working-directory: packaging/windows/pman_thumbnail
        run: cargo fmt --all --check

      - name: Lint (clippy)
        working-directory: packaging/windows/pman_thumbnail
        run: cargo clippy --all-targets -- -D warnings

  # Portability gate: the declared floor (3.10) and ceiling (3.12) of
  # requires-python, plus the two desktop platforms we ship installers for.
  # macOS is here because release.yml builds a .dmg; without it the first
  # macOS run of the code is the release build itself.
  # Lint/typecheck/coverage/site generation stay in the `test` job below so
  # this one only answers "does it run there?".
  portability:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.11"
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-build-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile translation catalogues
        run: python scripts/update_translations.py

      - name: Run tests
        run: python scripts/run_tests.py -q

  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-build-env

      - uses: ./.github/actions/static-checks

      # The README release badges are hard-coded rather than live shields, so
      # they silently drift a release behind; this keeps them matching
      # pyproject. (They date from when the repository was private and
      # shields.io could not read it -- they could now be made dynamic.)
      - name: Check README version badges
        run: python scripts/check_version.py

      - name: Run tests
        run: >
          python scripts/run_tests.py -q
          --cov=paintmaskanimator --cov-report=term-missing --cov-report=xml
          --cov-report=json:progress-site/.coverage-map.json
          --cov-report=html:coverage-html

      # coverage.xml used to be uploaded as an artifact nothing ever read.
      # The number is worth seeing on the run itself instead.
      - name: Report coverage
        if: always()
        run: python scripts/coverage_summary.py coverage.xml

      # pages.yml puts this at coverage/ on the release site. It rebuilds that
      # site on releases and site edits too, long after this run, so the
      # artifact has to outlive the run.
      - name: Upload coverage report
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-html
          include-hidden-files: true
          retention-days: 90

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: progress-site/package-lock.json

      - name: Generate feature verification map
        working-directory: progress-site
        env:
          # Served from the GitHub Pages project site; see pages.yml.
          SITE_BASE_PATH: /PaintMaskAnimator/feature-map
        run: |
          npm ci
          npm run data
          npm test
          npm run export-site

      - name: Upload feature map artifact
        uses: actions/upload-artifact@v4
        with:
          name: feature-map-${{ github.sha }}
          path: progress-site/dist/site
          include-hidden-files: true
          # main's copy is what pages.yml serves at feature-map/, and that site
          # is rebuilt long after this run; other runs' copies are only for
          # looking at a pull request's map.
          retention-days: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 90 || 7 }}

