name: Release site

# Builds the release site (site/ + scripts/build_release_site.py) and deploys
# it to GitHub Pages: the human-facing download page, built from the GitHub
# Releases API. It also carries the developer pages: the coverage report
# (coverage/) and the feature verification map (feature-map/), both taken from
# the latest successful CI run on main, and the Understand-Anything dashboard
# (understand/), built from the committed .ua/.
#
# Gated on the repository variable RELEASE_SITE_ENABLED, which is set to
# "true" and Pages is enabled, so this workflow is live.
#
# The Release workflow creates releases with GITHUB_TOKEN, which does not
# trigger `release` events, so the site rebuilds when that workflow finishes.
# CI is listed for the same reason in reverse: Pages replaces the whole site on
# every deploy, so a new coverage report reaches it only through a rebuild.

on:
  workflow_run:
    workflows: ["Release", "CI"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/build_release_site.py"
      - ".ua/**"
      - "docs/assets/logo.png"
  workflow_dispatch:

permissions:
  contents: read
  # Reading another workflow's artifacts (the coverage report).
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: >-
      vars.RELEASE_SITE_ENABLED == 'true' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      (github.event.workflow_run.name != 'CI' ||
       (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api "repos/${{ github.repository }}/releases" --paginate > releases.json

      - name: Build site
        run: python scripts/build_release_site.py --releases releases.json --output _site

      # Every deploy replaces the whole site, so each build has to bring CI's
      # pages along, not only builds started by CI. The artifacts are kept 90
      # days; past that the site deploys without them rather than fail.
      - name: Add the coverage report and feature map
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          read -r RUN_ID SHA < <(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml             --branch main --event push --status success --limit 1             --json databaseId,headSha --jq '.[0] | "\(.databaseId) \(.headSha)"') || true
          fetch() {  # artifact name, destination
            if [ -n "$RUN_ID" ] && gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY"                  --name "$1" --dir "$2"; then
              echo "$1 from CI run $RUN_ID."
            else
              echo "::warning::$1 not available; deploying without $2."
            fi
          }
          fetch coverage-report _site/coverage
          fetch "feature-map-$SHA" _site/feature-map

      # The Understand-Anything dashboard, served at understand/ beside the
      # release pages. The graph is generated by hand (/understand in Claude
      # Code) and committed to .ua/; until the first one lands this is skipped
      # and the site still deploys.
      - name: Check for a knowledge graph
        id: graph
        run: |
          if [ -f .ua/knowledge-graph.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No .ua/knowledge-graph.json yet; skipping the dashboard."
          fi

      - name: Check out the Understand-Anything dashboard
        if: steps.graph.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          repository: Egonex-AI/Understand-Anything
          # The dashboard must read the graph format the plugin that wrote .ua/
          # produced, so this tracks the installed plugin, not a release tag
          # (2.9.8 has none). Updating: docs/knowledge-graph.md.
          ref: 4e6d3299017a7432da15957874992837a315c5b4  # 2.9.8
          path: ua-upstream

      - uses: actions/setup-node@v4
        if: steps.graph.outputs.present == 'true'
        with:
          node-version: "22"

      - name: Build the dashboard
        if: steps.graph.outputs.present == 'true'
        working-directory: ua-upstream/understand-anything-plugin
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter @understand-anything/core build
          # Demo mode is the dashboard's static build: it fetches its data
          # files relative to the base URL instead of from the local viewer
          # server, which is what lets Pages serve it as plain files. The base
          # is the project-site path, /<repo>/understand/.
          pnpm --filter @understand-anything/dashboard exec vite build \
            --config vite.config.demo.ts \
            --base="/${GITHUB_REPOSITORY#*/}/understand/"

      - name: Add the dashboard to the site
        if: steps.graph.outputs.present == 'true'
        run: |
          DIST=ua-upstream/understand-anything-plugin/packages/dashboard/dist
          for f in knowledge-graph.json meta.json config.json domain-graph.json; do
            if [ -f ".ua/$f" ]; then cp ".ua/$f" "$DIST/$f"; fi
          done
          cp -r "$DIST" _site/understand

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
