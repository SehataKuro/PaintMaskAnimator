name: Set up build environment
description: >-
  Python + Qt runtime libraries + the Rust native extension, shared by ci.yml
  and release.yml so the two cannot drift apart.

inputs:
  python-version:
    description: Python version to install.
    required: false
    default: "3.11"
  extra-pip:
    description: Extra pip packages (space separated) installed after the dev requirements.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip

    # System libraries PySide6 needs even in offscreen mode.
    - name: Install Qt runtime libraries
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
          libglib2.0-0 libfontconfig1 libfreetype6

    - name: Install Python dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        if [ -n "${{ inputs.extra-pip }}" ]; then
          pip install ${{ inputs.extra-pip }}
        fi

    # Without this every job recompiles pyo3, rusqlite and libsqlite3-sys from
    # scratch, which is the single largest chunk of CI wall time.
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: native
        shared-key: native

    # The distributed build always uses the Rust extension, so a failure to
    # build it must stop the job (the numpy fallback would silently be slower).
    - name: Build native module (Rust)
      shell: bash
      run: |
        pip install ./native
        python -c "from paintmaskanimator import native; print('pma_native', native._native.__version__)"
