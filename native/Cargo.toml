[workspace]
members = [".", "core", "io", "clip-import"]
resolver = "2"

[package]
name = "pma_native"
version = "0.3.0"
edition = "2021"
description = "PaintMaskAnimator の重い画像計算（Rust 実装）"
license = "Apache-2.0"
publish = false

[lib]
name = "pma_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pma-core = { path = "core" }
# 書き出し・読み込みのファイル操作（Tauri の画面と同じ実装を Python からも呼ぶ）。
pma-io = { path = "io" }
pyo3 = { version = "0.30.1", features = ["abi3-py39"] }
# Local 1.2.0 compatibility patch for metadata-only cel mixers; see
# vendor/clipfile/PMA-PATCHES.md. Keep Cargo.lock for reproducible builds.
clipfile = { version = "1.2", path = "vendor/clipfile", features = ["raster", "animation"] }
rusqlite = { version = "0.39.0", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
