[package]
name = "pma_native"
version = "0.3.0"
edition = "2021"
description = "PaintMaskAnimator の重い画像計算（Rust 実装）"
license = "Apache-2.0"
publish = false

[lib]
name = "pma_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30.1", features = ["abi3-py39"] }
clipfile = { version = "=1.2.0", features = ["raster", "animation"] }
rusqlite = { version = "0.39.0", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
