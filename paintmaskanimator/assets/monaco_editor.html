<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <style>
    html, body, #editor { width: 100%; height: 100%; margin: 0; overflow: hidden; }
  </style>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script src="monaco/vs/loader.js"></script>
</head>
<body>
  <div id="editor"></div>
  <script>
    let editor;
    let bridge;

    new QWebChannel(qt.webChannelTransport, channel => {
      bridge = channel.objects.bridge;
      require.config({ paths: { vs: "monaco/vs" } });
      require(["vs/editor/editor.main"], () => {
        editor = monaco.editor.create(document.getElementById("editor"), {
          value: "",
          language: "python",
          automaticLayout: true,
          fontFamily: "Consolas, 'Cascadia Code', monospace",
          fontSize: 14,
          insertSpaces: true,
          tabSize: 4,
          detectIndentation: false,
          minimap: { enabled: false },
          scrollBeyondLastLine: false,
          renderWhitespace: "selection",
          roundedSelection: false
        });
        editor.onDidChangeModelContent(() => bridge.contentChanged(editor.getValue()));
        bridge.editorReady();
      });
    });

    window.setEditorText = text => {
      if (editor && editor.getValue() !== text) editor.setValue(text);
    };
    window.focusEditor = () => { if (editor) editor.focus(); };
  </script>
</body>
</html>
